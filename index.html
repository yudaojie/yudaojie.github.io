<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/amis/sdk/sdk.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/amis/sdk/helper.css"
  />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/amis/sdk/iconfont.css"
  />
  <!-- 这是默认主题所需的，如果是其他主题则不需要 -->
  <!-- 从 1.1.0 开始 sdk.css 将不支持 IE 11，如果要支持 IE11 请引用这个 css，并把前面那个删了 -->
  <!-- <link rel="stylesheet" href="sdk-ie11.css" /> -->
  <!-- 不过 amis 开发团队几乎没测试过 IE 11 下的效果，所以可能有细节功能用不了，如果发现请报 issue -->
  <style>
      html,
      body,
      .app-wrapper {
          position: relative;
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
      }
  </style>
</head>
<body>
<div id="root" class="app-wrapper"></div>
<script src="https://cdn.jsdelivr.net/npm/amis/sdk/sdk.js"></script>
<script type="text/javascript">
  (function () {
    let amis = amisRequire("amis/embed");
    // 通过替换下面这个配置来生成不同页面111122222333444
    let amisJSON = {
      "type": "page",
      "title": "Hello world",
      "body":  "package com.google.demoForIdea.controller;


import com.google.demoForIdea.dao.SqlDao;
import org.springframework.beans.factory.annotation.Autowired;
import org.springframework.web.bind.annotation.*;
import java.util.HashMap;
import java.util.Map;
@RestController
@RequestMapping(value = user)
public class SqlController {
    @Autowired
    private SqlDao sqlDao;



    @GetMapping(getSql)
    public Map getsql() {
            Map<String, Object> resultMap = new HashMap<>();
            resultMap.put(status,0);
            resultMap.put(msg,查询成功);
            resultMap.put(rows,sqlDao.getSql());
            return resultMap;
    }


    @PostMapping(addSql)
    public Map addsql(@RequestBody Map<String, Object> map) {
        Map<String, Object> resultMap = new HashMap<>();
        try {
             sqlDao.addSql(map);
            resultMap.put(status,0);
            resultMap.put(msg,新增成功);
        }catch (Exception e){
            e.printStackTrace();
            resultMap.put(status,1);
            resultMap.put(msg,新增失败);
        }
        return resultMap;
    }
    @PostMapping(updateSql)
    public Map updateSql(@RequestBody Map<String, Object> map) {
        Map<String, Object> resultMap = new HashMap<>();
        try {
            sqlDao.updateSql(map);
            resultMap.put(status,0);
            resultMap.put(msg,修改成功);
        }catch (Exception e){
            e.printStackTrace();
            resultMap.put("status",1);

            resultMap.put(msg,修改失败);
        }
        return resultMap;
    }
    @PostMapping(deleteSql)
    public Map deleteSql(@RequestBody Map<String, Object> map) {
        Map<String, Object> resultMap = new HashMap<>();
        try {
            sqlDao.deletSql(map);
            resultMap.put(status,0);
            resultMap.put(msg,删除成功);
        }catch (Exception e){
            e.printStackTrace();
            resultMap.put(status,1);
            resultMap.put(msg,删除失败);
        }

        return resultMap;
    }



}
"
      }
    };
    let amisScoped = amis.embed(
      "#root",
      amisJSON,
      {}, //这个空对象可以放固定数据如 data:{imgIp:""}
      {
        fetcher: function (config) {
          let result = axios_http2(config);
          return result;
        },
      }
    );
  })();
</script>
</body>
</html>
